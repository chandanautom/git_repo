---
- name: Static route module
  hosts: R2
  gather_facts: false
  tasks:

    - name: Configure static route
      cisco.ios.static_routes:
        config:
          - address_families:
              - afi: ipv4
                routes:
                  - dest: 100.0.0.0/24
                    next_hops:
                      - forward_router_address: 192.168.0.1
                        name: 1st_route
                        distance_metric: 10
        # state: rendered
        # state: merged
        state: deleted
      register: static_route

    - name: printer deleted user
      ansible.builtin.debug:
        msg: "{{ static_route }}"

        