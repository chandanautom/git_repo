---
- name: Nested parent command configuration
  hosts: R1
  gather_facts: false

  tasks:
    - name: Configure archive logging configuration
      cisco.ios.ios_config:
        lines:
          - record rc
          - logging enable
        parents:
          - archive
          - log config
      register: archive_config_logging

    - name: Configure archive path configuration
      cisco.ios.ios_config:
        lines:
          - "path flash0:"
        parents:
          - archive
      register: archive_config_path

    - name: Print archive logging configuration
      ansible.builtin.debug:
        msg: 
          - "{{ archive_config_logging }}"
          - "{{ archive_config_path }}"