---
- name: Cisco ios_command
  hosts: routers
  gather_facts: false

  tasks:
    # - name: Send command with prompt
    #   cisco.ios.ios_command:
    #     commands:
    #       - command: clear counters GigabitEthernet0/0
    #         prompt: 'Clear "show interface" counters on this interface \[confirm\]'
    #         answer: 'y'
    #   register: clear_counters_output

    - name: Send command with prompt
      cisco.ios.ios_command:
        commands:
          - command: clear counters GigabitEthernet {{ intf_id }}
            prompt: 'Clear "show interface" counters on this interface \[confirm\]'
            answer: 'y'
      register: clear_counters_output

    - name: Clear counters output
      ansible.builtin.debug:
        msg: "{{ clear_counters_output.stdout_lines }}"

    - name: Execute interface interface_id
      cisco.ios.ios_command:
        commands:
          - show interface GigabitEthernet {{ intf_id }}
      register: show_interface_output

    - name: Print show interface Gi0/0
      ansible.builtin.debug:
        msg: "{{ show_interface_output.stdout_lines }}"
